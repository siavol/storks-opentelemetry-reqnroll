# Reusable E2E: called by ci.yml and release.yml after build.yml.
# Runs the E2E fixture (tests/E2E) and its report checks on the packed nupkg (UseLocalPackage=true), exactly as a
# user's project consumes it, then the Aspire and In-process samples as smoke tests. Ubuntu only: the Aspire sample needs Docker (Postgres container).
name: E2E

on:
  workflow_call:
    inputs:
      package-artifact:
        description: Name of the artifact with the nupkg from build.yml.
        type: string
        required: true

permissions: {}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  e2e:
    name: E2E (fixture and Aspire sample on the nupkg)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          # Local package mode restores into artifacts/samples-packages, not the global packages folder.
          cache: "false"

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.package-artifact }}
          path: artifacts/packages

      # Restore is not locked in local package mode (the package version changes with every commit);
      # build.yml has already checked the committed lock files with a locked restore.
      - name: Run E2E.Specs on the nupkg
        run: |
          set +e
          dotnet test tests/E2E/E2E.Specs -p:UseLocalPackage=true \
            --logger "trx;LogFileName=e2e-specs.trx" --results-directory artifacts/test-results
          echo "dotnet test exited with $? (non-zero is expected: @expected-failure fails by design; checked next)"

      # The @expected-failure scenario in tests/E2E/E2E.Specs/Features/Quotes.feature fails on purpose: the report checks
      # assert its red step. Update the name here if that scenario is renamed.
      - name: Check that only @expected-failure is red
        run: python3 -I .github/scripts/only-expected-red.py artifacts/test-results/e2e-specs.trx CustomerGetsAQuoteForASKUWhosePriceCannotBeFetched

      - name: E2E report checks
        run: dotnet test tests/E2E/E2E.ReportChecks

      - name: Run App.Specs on the nupkg
        run: |
          set +e
          dotnet test samples/Aspire/App.Specs -p:UseLocalPackage=true \
            --logger "trx;LogFileName=app-specs.trx" --results-directory artifacts/test-results
          echo "dotnet test exited with $? (non-zero is expected: @demo-failure fails by design; checked next)"

      # The @demo-failure scenario in samples/Aspire/App.Specs/Features/Checkout.feature fails on purpose, so the
      # report shows a red scenario. Here: that exact scenario failed and every other test passed.
      # Update the name here if that scenario is renamed.
      - name: Check that only @demo-failure is red
        run: python3 -I .github/scripts/only-expected-red.py artifacts/test-results/app-specs.trx CustomerPlacesAnOrderForASKUWhosePriceCannotBeFetched

      - name: Check that the sample wrote telemetry.html
        run: test -s samples/Aspire/App.Specs/bin/Debug/net11.0/reports/telemetry.html

      - name: Run the In-process sample on the nupkg
        run: dotnet test samples/InProcess/Prices.Specs -p:UseLocalPackage=true

      - name: Check that the In-process sample wrote telemetry.html
        run: test -s samples/InProcess/Prices.Specs/bin/Debug/net11.0/reports/telemetry.html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            tests/E2E/E2E.Specs/bin/Debug/net11.0/reports/
            samples/Aspire/App.Specs/bin/Debug/net11.0/reports/
            samples/InProcess/Prices.Specs/bin/Debug/net11.0/reports/
            artifacts/test-results/
          if-no-files-found: ignore
