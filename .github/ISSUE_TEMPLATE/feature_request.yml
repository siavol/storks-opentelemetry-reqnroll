name: Feature request
description: Suggest an idea or an improvement.
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like the plugin to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you tried.
  - type: textarea
    id: context
    attributes:
      label: Anything else
