name: Bug report
description: Something in Storks.OpenTelemetry.Reqnroll does not work as expected.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security vulnerabilities go through private reporting instead, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including test output lines prefixed with `[Storks.OpenTelemetry]`, if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal project, or a feature file plus how the SUT exports telemetry. A link to a repository is best.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Storks.OpenTelemetry.Reqnroll version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      description: Output of `dotnet --version` and the test project's target framework.
      placeholder: "10.0.100, net10.0"
    validations:
      required: true
  - type: input
    id: reqnroll-version
    attributes:
      label: Reqnroll version
      placeholder: "3.3.4"
    validations:
      required: true
  - type: dropdown
    id: test-framework
    attributes:
      label: Test framework
      options:
        - NUnit
        - xUnit
        - MSTest
        - TUnit
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: test-framework-version
    attributes:
      label: Test framework version
      description: For example the `Reqnroll.NUnit` and `NUnit` package versions.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / Windows 11 / macOS 15"
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: How the SUT is hosted (Aspire, Docker, in-process), whether scenarios run in parallel, report files, screenshots.
